<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.bar h1{font-size:18px}.bar .t{margin-left:auto;font-size:13px;color:var(--sub)}.bar .t b{font-size:20px;color:var(--ai)}
.dots{display:flex;gap:4px;padding:8px 16px 0}.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}.dots i.d{background:var(--ai)}.dots i.n{background:var(--shu)}
.done{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-bottom:1px solid var(--line);background:#fff;font-size:15px}
.done .n{width:22px;height:22px;border-radius:50%;background:var(--ai);color:#fff;font-size:12px;display:grid;place-items:center}
.done b{font-size:16px}.done .ch{margin-left:auto;color:var(--sub);font-size:13px}
.cur{background:#fff;margin:12px 0;border-top:3px solid var(--shu);padding:14px 16px}
.cur h2{font-size:20px;margin-bottom:4px}.cur .note{font-size:13px;color:var(--sub);margin-bottom:10px}
.it{display:flex;align-items:center;justify-content:space-between;min-height:56px;border-top:1px solid var(--line);font-size:17px;font-weight:700}
.seg{display:flex;border:2px solid var(--ai);border-radius:10px;overflow:hidden;font-size:14px}
.seg span{padding:10px 12px;min-width:56px;text-align:center;color:var(--ai)}.seg span+span{border-left:2px solid var(--ai)}
.seg .on{background:var(--ai);color:#fff}.seg .onk{background:var(--ki);color:var(--kimoji)}
.later{padding:0 16px}.later div{height:44px;display:flex;align-items:center;gap:10px;color:var(--sub);font-size:15px;border-bottom:1px dashed var(--line)}
.save{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px 14px}
.save small{display:block;text-align:center;color:var(--sub);font-size:12px;margin-bottom:6px}
.save div{background:var(--ai);color:#fff;text-align:center;font-weight:700;font-size:17px;border-radius:12px;padding:15px}
.ev{background:transparent!important;border:1.5px solid #fff}</style></head><body>
<div class="top"><b>売り場バトン</b><span>今のスタッフ <span class="me">森田 陽菜<span class="ev">イベント</span></span></span></div>
<div class="bar"><h1>記録する</h1><span class="t">3/5 ・ 目標30秒 ・ 12秒</span></div>
<div class="done"><span class="n">✓</span><b>アベ タクミ</b> 0858<span class="ch">変える</span></div>
<div class="done"><span class="n">✓</span><b>のりかえ(MNP)</b><span class="ch">変える</span></div>
<div class="cur"><h2>3 案内したこと</h2><div class="note">押した項目だけ残る。押さない項目は前回のまま</div>
<div class="it">料金比較<span class="seg"><span class="on">説明済み</span><span>あいまい</span></span></div>
<div class="it">端末価格<span class="seg"><span>説明済み</span><span>あいまい</span></span></div>
<div class="it">下取り<span class="seg"><span>説明済み</span><span class="onk">あいまい</span></span></div>
<div class="it">キャンペーン<span class="seg"><span>説明済み</span><span>あいまい</span></span></div>
<div class="it">必要書類<span class="seg"><span>説明済み</span><span>あいまい</span></span></div>
<div style="text-align:right;margin-top:10px"><span style="background:var(--ai);color:#fff;border-radius:10px;padding:10px 18px;font-weight:700">次へ</span></div>
</div>
<div class="later"><div>4 温度感</div><div>5 次にやること・来店予定 ・ 任意</div><div>メモ ・ 任意</div></div>
<div style="height:24px"></div>
<div class="save"><small>あと:温度感(押すと開きます)</small><div>保存する</div></div>
</body></html>
